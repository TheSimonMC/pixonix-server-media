name: Server mappings
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate mappings
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: validator
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.2.0
      - name: Check submissions with the trusted validator
        run: |
          scripts=validator/.github/scripts
          if [ ! -d "$scripts" ]; then scripts=validator/tools; fi
          python -m unittest discover -s "$scripts"
          python -I "$scripts/build_index.py" --root candidate --output "$RUNNER_TEMP/index.json"
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          mkdir public
          cp -r candidate/docs/. public/
          cp -r candidate/minecraft_servers public/
          cp "$RUNNER_TEMP/index.json" public/index.json
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
  publish:
    name: Publish editor and catalog
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
