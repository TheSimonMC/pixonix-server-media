name: Server mappings
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '27 * * * *'

permissions:
  contents: read

jobs:
  validate:
    name: Validate mappings
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      deploy: ${{ steps.release.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.2.0
      - name: Check mappings and build the client catalog
        run: |
          python -m unittest discover -s .github/scripts
          python -I .github/scripts/build_index.py --output "$RUNNER_TEMP/index.json"
      - id: release
        if: github.ref == 'refs/heads/main'
        run: |
          if [ "$GITHUB_EVENT_NAME" != schedule ] || [ "$(curl -fsSL --max-time 15 https://thesimonmc.github.io/pixonix-server-media/revision.txt || true)" != "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.release.outputs.deploy == 'true'
        run: |
          mkdir public
          cp -r docs/. public/
          cp -r minecraft_servers public/
          cp "$RUNNER_TEMP/index.json" public/index.json
          echo "$GITHUB_SHA" > public/revision.txt
      - if: steps.release.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
  publish:
    name: Publish editor and catalog
    needs: validate
    if: needs.validate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
